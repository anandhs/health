<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Minutes of Calm</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf5f0;background:#101f20}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#244a49,#101f20 70%)}main{width:min(94vw,560px);text-align:center;padding:35px 20px}h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:550;letter-spacing:.01em;margin:0 0 10px}.sub{color:#b6cfca;margin:0 0 42px}.orb-wrap{height:275px;display:grid;place-items:center}.orb{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#a4e4cb,#56ad9d 65%,#3d827b);box-shadow:0 0 55px #7dd5b33c;transform:scale(.78);transition:transform 4s linear,box-shadow 4s linear}.orb.inhale{transform:scale(1.24);box-shadow:0 0 85px #7dd5b380;transition-duration:4s}.orb.exhale{transform:scale(.78);box-shadow:0 0 45px #7dd5b33c;transition-duration:6s}.orb.paused{transition:none}.phase{color:#112e2c;font-size:1.4rem;font-weight:650}.count{font-size:3rem;font-variant-numeric:tabular-nums;font-weight:350;margin:25px 0 2px}.hint{color:#b6cfca;margin:0 0 28px}button{border:0;border-radius:999px;padding:13px 27px;font:inherit;cursor:pointer;margin:5px;background:#b2e7d3;color:#13322d;font-weight:650}button.secondary{background:#294744;color:#e3f6ed;border:1px solid #55756d}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.settings{margin-top:30px;color:#b6cfca;font-size:.95rem}.settings label{display:inline-flex;align-items:center;gap:9px;cursor:pointer}.settings input{accent-color:#a5e3ca;width:18px;height:18px}.small{font-size:.82rem;color:#8ba9a2;margin-top:23px}.status{min-height:1.5em;color:#b6cfca}@media(prefers-reduced-motion:reduce){.orb{transition:none!important}}
</style></head><body><main><h1>Three Minutes of Calm</h1><p class="sub">Breathe in for 4 seconds · out for 6 seconds</p><div class="orb-wrap"><div class="orb" id="orb"><span class="phase" id="phase">Ready</span></div></div><div class="count" id="remaining">3:00</div><p class="hint" id="detail">18 gentle breaths</p><div><button id="start">Start breathing</button><button class="secondary" id="reset">Reset</button></div><div class="settings"><label><input type="checkbox" id="sound" checked> Audible breathing cues</label></div><p class="status" id="status" aria-live="polite"></p><p class="small">A soft high tone means inhale; a lower tone means exhale. Keep this page open while breathing.</p></main><script>
(()=>{const TOTAL=180,IN=4,OUT=6;let running=false,elapsed=0,anchor=0,frame=0,ctx=null,phaseIndex=-1;const $=id=>document.getElementById(id),orb=$('orb'),phase=$('phase'),remaining=$('remaining'),detail=$('detail'),start=$('start'),status=$('status');function audio(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)ctx=new AC()}if(ctx&&ctx.state==='suspended')ctx.resume()}function tone(freq,duration=.32,vol=.065){if(!$('sound').checked||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+duration+.02)}function update(){let left=Math.max(0,Math.ceil(TOTAL-elapsed));remaining.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(elapsed>=TOTAL){finish();return}let cycle=Math.floor(elapsed/10),part=elapsed%10,inhale=part<IN,idx=cycle*2+(inhale?0:1);if(idx!==phaseIndex){phaseIndex=idx;phase.textContent=inhale?'Inhale':'Exhale';orb.className='orb '+(inhale?'inhale':'exhale');tone(inhale?660:440);if(inhale){detail.textContent=`Breath ${cycle+1} of 18`}}}function tick(){if(!running)return;elapsed=Math.min(TOTAL,(performance.now()-anchor)/1000);update();if(running)frame=requestAnimationFrame(tick)}function finish(){running=false;cancelAnimationFrame(frame);elapsed=TOTAL;remaining.textContent='0:00';phase.textContent='Complete';orb.className='orb';detail.textContent='18 breaths completed';status.textContent='Well done. Take a moment before moving on.';start.textContent='Start again';phaseIndex=-1;tone(784,.7,.045)}function pause(){running=false;cancelAnimationFrame(frame);orb.classList.add('paused');start.textContent='Resume';status.textContent='Paused'}function begin(){if(elapsed>=TOTAL){elapsed=0;phaseIndex=-1}audio();running=true;anchor=performance.now()-elapsed*1000;start.textContent='Pause';status.textContent='';tick()}start.addEventListener('click',()=>running?pause():begin());$('reset').addEventListener('click',()=>{running=false;cancelAnimationFrame(frame);elapsed=0;phaseIndex=-1;orb.className='orb';phase.textContent='Ready';remaining.textContent='3:00';detail.textContent='18 gentle breaths';start.textContent='Start breathing';status.textContent=''});document.addEventListener('visibilitychange',()=>{if(running){elapsed=Math.min(TOTAL,(performance.now()-anchor)/1000);update()}});})();
</script></body></html>
